[package]
name = "spiderman_bevy"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/sm_traversal"]

[dependencies]
sm_traversal = { path = "crates/sm_traversal" }
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui", "default_font", "png", "jpeg", "multi_threaded", "gamepad"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
